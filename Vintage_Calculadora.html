<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculadora Multifuncional Vintage</title>
    <!-- Fonte digital vintage do Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Variáveis de cores padrão */
            --cor-carcaca: #242424;
            --cor-botao: #d4d4d4;
            --cor-visor: #8b9977;
            --cor-detalhe: #111;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #4a4a4a, #2b2b2b);
            padding: 20px;
        }

        .dispositivo {
            background-color: var(--cor-carcaca);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 
                0 15px 35px rgba(0,0,0,0.6), 
                inset 0 2px 5px rgba(255,255,255,0.1),
                inset 0 -3px 10px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 380px;
            transition: background-color 0.3s;
        }

        /* --- Painel Superior (Relógio, Cronômetro, Configs) --- */
        .painel-superior {
            background-color: var(--cor-detalhe);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .lcd-display {
            background-color: var(--cor-visor);
            color: #1a1a1a;
            font-family: 'VT323', monospace;
            padding: 5px 10px;
            border-radius: 5px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 24px;
        }

        .cronometro-controles {
            display: flex;
            gap: 10px;
        }

        .btn-pequeno {
            flex: 1;
            padding: 8px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 5px;
            background-color: #555;
            color: white;
            border: none;
            cursor: pointer;
            box-shadow: 0 3px 0 #333;
        }
        .btn-pequeno:active {
            transform: translateY(3px);
            box-shadow: 0 0 0 #333;
        }

        .configuracoes {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #333;
            padding-top: 10px;
        }

        .config-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: #aaa;
            text-transform: uppercase;
        }

        .config-item input[type="color"] {
            border: none;
            width: 25px;
            height: 25px;
            cursor: pointer;
            border-radius: 50%;
            padding: 0;
            background: none;
        }

        .btn-som {
            background: none;
            border: 1px solid #555;
            color: #ccc;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-som.desativado {
            color: #f44336;
            border-color: #f44336;
        }

        /* --- Visor Principal --- */
        .visor-principal {
            background-color: var(--cor-visor);
            color: #1a1a1a;
            font-family: 'VT323', monospace;
            font-size: 56px;
            text-align: right;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: inset 0 3px 10px rgba(0,0,0,0.3), 0 2px 0 rgba(255,255,255,0.05);
            overflow: hidden;
            white-space: nowrap;
            letter-spacing: 2px;
            border: 2px solid #111;
        }

        /* --- Botões da Calculadora --- */
        .botoes {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button.tecla {
            background-color: var(--cor-botao);
            border: none;
            padding: 18px 0;
            font-size: 22px;
            font-weight: bold;
            color: #222;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 5px 0 rgba(0,0,0,0.3);
            transition: transform 0.1s, box-shadow 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button.tecla:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 rgba(0,0,0,0.3);
        }

        .btn-operacao {
            background-color: #f39c12 !important;
            color: white !important;
            box-shadow: 0 5px 0 #c07d06 !important;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.2);
        }

        .btn-igual {
            background-color: #27ae60 !important;
            color: white !important;
            box-shadow: 0 5px 0 #1e8449 !important;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.2);
        }

        .btn-limpar {
            background-color: #e74c3c !important;
            color: white !important;
            box-shadow: 0 5px 0 #b33929 !important;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.2);
        }

        /* Ajustes Mobile */
        @media (max-width: 400px) {
            .dispositivo {
                padding: 15px;
            }
            .visor-principal {
                font-size: 48px;
            }
            button.tecla {
                padding: 15px 0;
                font-size: 20px;
            }
            .lcd-display {
                font-size: 20px;
            }
        }
    </style>
    
<style>
    #btn-sair-oculto {
        position: fixed;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 60px;
        height: 12px; /* Super discreto inicialmente */
        background-color: rgba(255, 255, 255, 0.2); /* Fundo claro e transparente */
        border-bottom-left-radius: 8px;
        border-bottom-right-radius: 8px;
        cursor: pointer;
        z-index: 99999; /* Garante que fique acima de todos os elementos do jogo */
        transition: all 0.3s ease;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        backdrop-filter: blur(2px); /* Dá um leve desfoque no fundo */
    }

    /* Expansão ao passar o mouse ou tocar */
    #btn-sair-oculto:hover, #btn-sair-oculto:active {
        height: 40px;
        width: 100px;
        background-color: #8B0000; /* Cor vermelha do seu painel offline */
        box-shadow: 0 4px 15px rgba(139, 0, 0, 0.4);
    }

    #btn-sair-oculto span {
        color: white;
        font-weight: bold;
        font-family: 'Segoe UI', Tahoma, sans-serif;
        font-size: 14px;
        opacity: 0; /* O texto começa invisível */
        transition: opacity 0.3s ease;
    }

    #btn-sair-oculto:hover span, #btn-sair-oculto:active span {
        opacity: 1; /* O texto aparece na expansão */
    }
</style>
</head>
<body>
<!-- Início do Botão de Sair Oculto -->
<div id="btn-sair-oculto" onclick="window.location.href='offline.html'">
    <span>Sair</span>
</div>

    <div class="dispositivo">
        <!-- Painel Superior de Ferramentas -->
        <div class="painel-superior">
            <!-- Relógio e Cronômetro -->
            <div class="lcd-display">
                <span id="relogio">00:00</span>
                <span id="cronometro" style="color: #444;">00:00.0</span>
            </div>
            
            <div class="cronometro-controles">
                <button class="btn-pequeno" id="btn-iniciar-crono" onclick="alternarCronometro()">⏱ Iniciar</button>
                <button class="btn-pequeno" onclick="zerarCronometro()">Zerar</button>
            </div>

            <!-- Configurações -->
            <div class="configuracoes">
                <div class="config-item">
                    Carcaça <input type="color" id="corCarcaca" value="#242424">
                </div>
                <div class="config-item">
                    Teclas <input type="color" id="corBotao" value="#d4d4d4">
                </div>
                <button class="btn-som" id="btn-som" onclick="alternarSom()">🔊 Som On</button>
            </div>
        </div>

        <!-- Calculadora Principal -->
        <div class="visor-principal" id="visor">0</div>
        <div class="botoes">
            <button class="tecla btn-limpar" onclick="limparVisor()">C</button>
            <button class="tecla" onclick="adicionarValor('(')">(</button>
            <button class="tecla" onclick="adicionarValor(')')">)</button>
            <button class="tecla btn-operacao" onclick="adicionarValor('/')">÷</button>

            <button class="tecla" onclick="adicionarValor('7')">7</button>
            <button class="tecla" onclick="adicionarValor('8')">8</button>
            <button class="tecla" onclick="adicionarValor('9')">9</button>
            <button class="tecla btn-operacao" onclick="adicionarValor('*')">×</button>

            <button class="tecla" onclick="adicionarValor('4')">4</button>
            <button class="tecla" onclick="adicionarValor('5')">5</button>
            <button class="tecla" onclick="adicionarValor('6')">6</button>
            <button class="tecla btn-operacao" onclick="adicionarValor('-')">-</button>

            <button class="tecla" onclick="adicionarValor('1')">1</button>
            <button class="tecla" onclick="adicionarValor('2')">2</button>
            <button class="tecla" onclick="adicionarValor('3')">3</button>
            <button class="tecla btn-operacao" onclick="adicionarValor('+')">+</button>

            <button class="tecla" onclick="adicionarValor('0')">0</button>
            <button class="tecla" onclick="adicionarValor('.')">.</button>
            <button class="tecla btn-igual" onclick="calcular()" style="grid-column: span 2;">=</button>
        </div>
    </div>

    <script>
        // ================= Configurações de Cores =================
        const inputCorCarcaca = document.getElementById('corCarcaca');
        const inputCorBotao = document.getElementById('corBotao');

        inputCorCarcaca.addEventListener('input', (e) => {
            document.documentElement.style.setProperty('--cor-carcaca', e.target.value);
        });

        inputCorBotao.addEventListener('input', (e) => {
            document.documentElement.style.setProperty('--cor-botao', e.target.value);
        });

        // ================= Lógica do Som =================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let somAtivado = true;
        
        function alternarSom() {
            somAtivado = !somAtivado;
            const btnSom = document.getElementById('btn-som');
            if(somAtivado) {
                btnSom.innerText = "🔊 Som On";
                btnSom.classList.remove('desativado');
                tocarSom();
            } else {
                btnSom.innerText = "🔇 Som Off";
                btnSom.classList.add('desativado');
            }
        }

        function tocarSom() {
            if (!somAtivado) return;
            
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = 'square';
            oscillator.frequency.setValueAtTime(600, audioCtx.currentTime); 
            
            gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime); 
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1); 
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.1);
        }

        // ================= Lógica do Relógio =================
        function atualizarRelogio() {
            const agora = new Date();
            const horas = String(agora.getHours()).padStart(2, '0');
            const minutos = String(agora.getMinutes()).padStart(2, '0');
            document.getElementById('relogio').innerText = `${horas}:${minutos}`;
        }
        setInterval(atualizarRelogio, 1000);
        atualizarRelogio();

        // ================= Lógica do Cronômetro =================
        let intervaloCrono;
        let tempoCrono = 0;
        let cronoRodando = false;

        function formatarTempoCrono(decimosDeSegundo) {
            const minutos = String(Math.floor(decimosDeSegundo / 600)).padStart(2, '0');
            const segundos = String(Math.floor((decimosDeSegundo % 600) / 10)).padStart(2, '0');
            const decimos = decimosDeSegundo % 10;
            return `${minutos}:${segundos}.${decimos}`;
        }

        function alternarCronometro() {
            tocarSom();
            const btn = document.getElementById('btn-iniciar-crono');
            const displayCrono = document.getElementById('cronometro');
            
            if (cronoRodando) {
                clearInterval(intervaloCrono);
                cronoRodando = false;
                btn.innerText = "⏱ Iniciar";
                displayCrono.style.color = "#444";
            } else {
                cronoRodando = true;
                btn.innerText = "⏸ Pausar";
                displayCrono.style.color = "#1a1a1a";
                intervaloCrono = setInterval(() => {
                    tempoCrono++;
                    displayCrono.innerText = formatarTempoCrono(tempoCrono);
                }, 100);
            }
        }

        function zerarCronometro() {
            tocarSom();
            clearInterval(intervaloCrono);
            cronoRodando = false;
            tempoCrono = 0;
            document.getElementById('cronometro').innerText = "00:00.0";
            document.getElementById('cronometro').style.color = "#444";
            document.getElementById('btn-iniciar-crono').innerText = "⏱ Iniciar";
        }

        // ================= Lógica da Calculadora =================
        const visor = document.getElementById('visor');

        function adicionarValor(valor) {
            tocarSom();
            if (visor.innerText === '0' || visor.innerText === 'Erro') {
                visor.innerText = valor;
            } else {
                visor.innerText += valor;
            }
            if(visor.innerText.length > 12) {
                visor.innerText = visor.innerText.substring(0, 12);
            }
        }

        function limparVisor() {
            tocarSom();
            visor.innerText = '0';
        }

        function calcular() {
            tocarSom();
            try {
                // Prevenção básica caso termine em operador
                let expressao = visor.innerText;
                let resultado = eval(expressao).toString();
                
                if (resultado.includes('.') && resultado.length > 10) {
                    resultado = parseFloat(resultado).toFixed(4);
                }
                
                visor.innerText = resultado;
            } catch (erro) {
                visor.innerText = 'Erro';
            }
        }
    </script>
</body>
</html>
