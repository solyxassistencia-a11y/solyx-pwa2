  <script>

let deferredInstallPrompt = null;

const installButton =
    document.getElementById("installButton");


window.addEventListener(
    "beforeinstallprompt",
    function (event) {

        event.preventDefault();

        deferredInstallPrompt = event;

        installButton.style.display = "flex";
        installButton.style.alignItems = "center";
        installButton.style.justifyContent = "center";

    }
);


installButton.addEventListener(
    "click",
    async function () {

        if (!deferredInstallPrompt) {
            return;
        }

        deferredInstallPrompt.prompt();

        const { outcome } =
            await deferredInstallPrompt.userChoice;

        console.log(
            "Resultado da instalação:",
            outcome
        );

        deferredInstallPrompt = null;

        installButton.style.display = "none";

    }
);


window.addEventListener(
    "appinstalled",
    function () {

        console.log(
            "Aplicativo Fidelidade instalado!"
        );

        installButton.style.display = "none";

    }
);

</script>

<script>
    // URL Oficial do Apps Script do SOLYX FIDELIDADE
    const API_URL = "https://script.google.com/macros/s/AKfycbySLSbcAqPyq2exmYmUa8vhKZ2nZ1YQ7a3N1q-n2T9Rw48RM-PsufD5Uszok5FA_ZHVJA/exec";

    async function carregarEConfigurarIdentidade() {
        try {
            // 1. Tenta carregar do cache para ser ultra-rápido
            const cache = sessionStorage.getItem('identidadeGlobal');
            if (cache) {
                aplicarIdentidadeVisual(JSON.parse(cache));
                return;
            }

            // 2. Se não tiver no cache, busca no Apps Script silenciosamente
            const res = await (await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'buscar_identidade' })
            })).json();

            // CORREÇÃO APLICADA AQUI: Busca por 'res.identidade'
            if (res.status === 'success' && res.identidade) {
                sessionStorage.setItem('identidadeGlobal', JSON.stringify(res.identidade));
                aplicarIdentidadeVisual(res.identidade);
            }
        } catch (e) {
            console.error("Erro ao carregar identidade visual:", e);
        }
    }

    function aplicarIdentidadeVisual(iden) {
        // Guarda o nome do programa na memória da página
        window.NOME_PROGRAMA = iden.Nome_Programa || "Solyx Fidelidade";

        // 1. Aplica o Fundo Gradiente Dinâmico (Específico da Tela de Abertura)
        if (iden.BG_COR1 && iden.BG_COR2) {
            document.body.style.background = `linear-gradient(335deg, ${iden.BG_COR1} 0%, ${iden.BG_COR2} 150%)`;
            document.body.style.minHeight = "100vh";
            document.body.style.backgroundRepeat = "no-repeat";
            document.body.style.backgroundAttachment = "fixed";
        }

        // 2. Aplica a Logo Dinâmica (Certifique-se de que a tag <img> tenha a class="logo-dinamica")
        if (iden.Logo_URL) {
            document.querySelectorAll('.logo-dinamica').forEach(logo => {
                logo.src = iden.Logo_URL;
            });
        }

        // 3. Atualiza o Título da Aba e Meta Description dinamicamente
        document.title = `Lojista - ${window.NOME_PROGRAMA}`;
        const metaDesc = document.querySelector('meta[name="description"]');
        if (metaDesc) {
            metaDesc.setAttribute('content', `${window.NOME_PROGRAMA} - Escolha seu tipo de acesso.`);
        }

        // 4. SUBSTITUIÇÃO INTELIGENTE NO HTML ESTÁTICO (O Padrão TreeWalker do seu ScriptID)
        const walker = document.createTreeWalker(
            document.body, 
            NodeFilter.SHOW_TEXT, 
            { acceptNode: function(node) {
                if (node.parentNode.nodeName === 'SCRIPT' || node.parentNode.nodeName === 'STYLE') {
                    return NodeFilter.FILTER_REJECT;
                }
                return NodeFilter.FILTER_ACCEPT;
            }}, 
            false
        );

        let node;
        while ((node = walker.nextNode())) {
            let texto = node.nodeValue;
            if (texto.trim() !== '') {
                // Procura a palavra "Solyx Fidelidade" e troca pelo novo nome do Sheets
                texto = texto.replace(/Solyx Fidelidade/gi, window.NOME_PROGRAMA);

                if (node.nodeValue !== texto) {
                    node.nodeValue = texto;
                }
            }
        }
    }

    // Dispara a função assim que a página carrega
    document.addEventListener("DOMContentLoaded", carregarEConfigurarIdentidade);
    injetarManifestAdmin(iden);
</script>

<script>
  function injetarManifestAdmin(iden) {
    // 1. Puxa os dados ou usa os padrões
    const nomeApp = iden.Nome_Programa ? iden.Nome_Programa + " Lojista" : "Solyx Lojista";
    const nomeCurto = iden.Nome_Programa ? iden.Nome_Programa.split(" ")[0] + " Admin" : "Solyx Admin";
    const corTema = "#8B0000";
    const corFundo = iden.BG_COR2 || "#FFFFFF";
    
    // ATENÇÃO AQUI: URL do Dropbox
    const iconeAdmin = "https://www.dropbox.com/scl/fi/ip6z1ggdrkatb842mwdst/Icon_SF_512x512.png?rlkey=v1u4dxlq947v27xn4u06ry23b&raw=1";

    // 2. Monta o arquivo Manifest Blindado
    const manifestJSON = {
        "name": nomeApp,
        "short_name": nomeCurto,
        "start_url": "./", // Correção 1: "./" Garante que o navegador aceite a rota como segura
        "display": "standalone",
        "background_color": corFundo,
        "theme_color": corTema,
        "icons": [
            {
                "src": iconeAdmin,
                "sizes": "512x512",
                "type": "image/png",
                "purpose": "any maskable"
            },
            {
                "src": "./icon-192.png", // Correção 2: Ícone reserva! Se o Dropbox falhar, esse salva a instalação.
                "sizes": "192x192",
                "type": "image/png",
                "purpose": "any maskable"
            }
        ]
    };

    // 3. Correção 3: Usar Data URI em vez de Blob (Leitura instantânea e imune a bloqueios)
    const stringManifest = JSON.stringify(manifestJSON);
    const manifestURL = 'data:application/json;charset=utf-8,' + encodeURIComponent(stringManifest);

    // 4. Injeta no HTML
    let linkManifest = document.querySelector('link[rel="manifest"]');
    if (!linkManifest) {
        linkManifest = document.createElement('link');
        linkManifest.rel = 'manifest';
        document.head.appendChild(linkManifest);
    }
    linkManifest.href = manifestURL;
}
    </script>
