  <script>

let deferredInstallPrompt = null;

const installButton =
    document.getElementById("installButton");


window.addEventListener(
    "beforeinstallprompt",
    function (event) {

        event.preventDefault();

        deferredInstallPrompt = event;

        installButton.style.display = "flex";
        installButton.style.alignItems = "center";
        installButton.style.justifyContent = "center";

    }
);


installButton.addEventListener(
    "click",
    async function () {

        if (!deferredInstallPrompt) {
            return;
        }

        deferredInstallPrompt.prompt();

        const { outcome } =
            await deferredInstallPrompt.userChoice;

        console.log(
            "Resultado da instalação:",
            outcome
        );

        deferredInstallPrompt = null;

        installButton.style.display = "none";

    }
);


window.addEventListener(
    "appinstalled",
    function () {

        console.log(
            "Aplicativo Fidelidade instalado!"
        );

        installButton.style.display = "none";

    }
);

</script>

<script>
// =========================================================================
    // FIDELIDADE.NET.BR IDENTIDADE VISUAL DINÂMINCA 6.0
    const API_URL = "https://script.google.com/macros/s/AKfycbwgFUB1b-yKqzxY7ncvZTywv6NimIM_OiBI7ws09kkU2atTMgN7AiM2uezrh6RTwyvTXA/exec";
// ==========================================
// FUNÇÕES DE IDENTIDADE VISUAL

// FORMULÁRIO 
async function carregarIdentidadeVisual() {
    try {
        const res = await (await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'buscar_identidade' })
        })).json();

        if (res.status === 'success') {
            const iden = res.identidade;
            
            // Preenchendo campos de texto
            if (document.getElementById('idTratamento')) document.getElementById('idTratamento').value = iden.Tratamento_Genero || '';
            if (document.getElementById('idLogo')) document.getElementById('idLogo').value = iden.Logo_URL || '';
            if (document.getElementById('idNome')) document.getElementById('idNome').value = iden.Nome_Programa || '';
          
            // MOEDA DINAMICA:
            if (document.getElementById('idMoeda')) document.getElementById('idMoeda').value = iden.Nome_Moeda || '';
            if (document.getElementById('idCifrao')) document.getElementById('idCifrao').value = iden.Cifrao_Moeda || '';
            if (document.getElementById('idImgMoeda')) document.getElementById('idImgMoeda').value = iden.Imagem_Moeda || '';

            if (document.getElementById('idTelefone')) document.getElementById('idTelefone').value = iden.Telefone_WPP || '';
            if (document.getElementById('idApi')) document.getElementById('idApi').value = iden.URL_API || '';
            if (document.getElementById('idAppCliente')) document.getElementById('idAppCliente').value = iden.URL_AppCliente || '';
            if (document.getElementById('idAppCadastro')) document.getElementById('idAppCadastro').value = iden.URL_Cadastro || '';
            if (document.getElementById('idAppPlayground')) document.getElementById('idAppPlayground').value = iden.URL_Playground || '';
            if (document.getElementById('idAppRoleta')) document.getElementById('idAppRoleta').value = iden.URL_Roleta || '';
            if (document.getElementById('idAppClaw')) document.getElementById('idAppClaw').value = iden.URL_ClawMachine || '';
            if (document.getElementById('idAppPescaria')) document.getElementById('idAppPescaria').value = iden.URL_Pescaria || '';
            if (document.getElementById('idAppSorteios')) document.getElementById('idAppSorteios').value = iden.URL_Sorteios || '';
            if (document.getElementById('idAppRoletaInterativa')) document.getElementById('idAppRoletaInterativa').value = iden.URL_RoletaInterativa || '';
            if (document.getElementById('idAppCampanhas')) document.getElementById('idAppCampanhas').value = iden.URL_Campanhas || '';
            if(document.getElementById('urlBackupSheets')) document.getElementById('urlBackupSheets').value = iden.URL_Planilha_BD || '';
            
            // --- PALETAS ---
            window.BG_COR1 = iden["BG_COR1"] || "#1a1a1a";
            window.BG_COR2 = iden["BG_COR2"] || "#550000";

            if (document.getElementById('idBgCor1')) document.getElementById('idBgCor1').value = window.BG_COR1;
            if (document.getElementById('idBgCor2')) document.getElementById('idBgCor2').value = window.BG_COR2;

        }
    } catch (e) {
        console.error("Erro ao carregar Identidade Visual", e);
    }
}

// Chame esta função na inicialização do painel ou no botão que abre a aba

async function salvarIdentidadeVisual() {
    const btn = event.target;
    const textoOriginal = btn.innerText;
    btn.innerText = "Salvando...";
    btn.disabled = true;

 
    const identidadeAtualizada = {
        Tratamento_Genero: document.getElementById('idTratamento') ? document.getElementById('idTratamento').value : 'a',
        Logo_URL: document.getElementById('idLogo').value,
        Nome_Programa: document.getElementById('idNome').value,
        Nome_Moeda: document.getElementById('idMoeda').value,
        Cifrao_Moeda: document.getElementById('idCifrao').value,
        Imagem_Moeda: document.getElementById('idImgMoeda').value,
      
        Telefone_WPP: document.getElementById('idTelefone').value,
        URL_API: document.getElementById('idApi').value,
        URL_AppCliente: document.getElementById('idAppCliente').value,
        URL_Cadastro: document.getElementById('idAppCadastro').value,
        URL_Playground: document.getElementById('idAppPlayground').value,
        URL_Roleta: document.getElementById('idAppRoleta').value,
        URL_ClawMachine: document.getElementById('idAppClaw').value,
        URL_Pescaria: document.getElementById('idAppPescaria').value,
      	URL_Sorteios: document.getElementById('idAppSorteios').value,
        URL_RoletaInterativa: document.getElementById('idAppRoletaInterativa').value,
        URL_Campanhas: document.getElementById('idAppCampanhas').value,
      
        // CORES / BACKGROUND
        "BG_COR1": document.getElementById('idBgCor1').value,
        "BG_COR2": document.getElementById('idBgCor2').value
      
        
    };

    try {
        const res = await (await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'salvar_identidade', identidade: identidadeAtualizada })
        })).json();

        if (res.status === 'success') {
            alert("Identidade Visual salva com sucesso!");
                 
        sessionStorage.removeItem('identidadeGlobal'); // Limpa o cache antigo para forçar a nova leitura
        } else {
            alert("Erro: " + res.message);
        }
    } catch (e) {
        alert("Erro ao conectar com o servidor.");
    }

    btn.innerText = textoOriginal;
    btn.disabled = false;
}


    async function carregarEConfigurarIdentidade() {
        try {
            const cache = sessionStorage.getItem('identidadeGlobal');
            if (cache) {
                aplicarIdentidadeVisual(JSON.parse(cache));
                return;
            }

            const res = await (await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'buscar_identidade' })
            })).json();

            if (res.status === 'success' && res.identidade) {
                sessionStorage.setItem('identidadeGlobal', JSON.stringify(res.identidade));
                aplicarIdentidadeVisual(res.identidade);
            }
        } catch (e) {
            console.error("Erro ao carregar identidade visual:", e);
        }
    }

    // ==========================================
    // DADOS NA TELA
    // ==========================================
    window.atualizarDadosClienteDinamicos = function() {
        let saldo = 0;
        let nomeCli = "Cliente";
        let apelidoCli = "Cliente";
        
        // Tenta capturar os dados do cliente logado na memória do app
        if (typeof clienteLogado !== 'undefined' && clienteLogado) {
            saldo = clienteLogado.saldoSXC !== undefined ? clienteLogado.saldoSXC : (clienteLogado.saldo || 0);
            nomeCli = clienteLogado.nome || "Cliente";
            apelidoCli = clienteLogado.apelido || nomeCli.split(' ')[0];
        } else if (typeof dadosCliente !== 'undefined' && dadosCliente) {
            saldo = dadosCliente.saldo || 0;
            nomeCli = dadosCliente.nome || "Cliente";
            apelidoCli = dadosCliente.apelido || nomeCli.split(' ')[0];
        }

        // 1. Salva nas Variáveis Globais
        window.SALDO_CLIENTE = saldo;
        window.NOME_CLIENTE = nomeCli;
        window.APELIDO_CLIENTE = apelidoCli;

        // 2. Injeta nas Classes Vazias do HTML
        document.querySelectorAll('.nome-cliente-dinamico').forEach(el => el.innerText = window.NOME_CLIENTE);
        document.querySelectorAll('.apelido-cliente-dinamico').forEach(el => el.innerText = window.APELIDO_CLIENTE);
        document.querySelectorAll('.saldo-dinamico').forEach(el => el.innerText = Number(window.SALDO_CLIENTE).toLocaleString('pt-BR'));
    };

    function aplicarIdentidadeVisual(iden) {
        // SALVA VARIÁVEIS GLOBAIS DE MARCA
        window.TRATAMENTO_MIN = (iden.Tratamento_Genero || "a").toLowerCase();
        window.TRATAMENTO_MAI = window.TRATAMENTO_MIN.toUpperCase();
        window.LOGO_URL = iden.Logo_URL || "";
        window.CIFRAO_MOEDA = iden.Cifrao_Moeda || "";
        window.IMAGEM_MOEDA = iden.Imagem_Moeda || ""; // IMAGEM DA MOEDA OFICIAL  
        window.NOME_PROGRAMA = iden.Nome_Programa || "";
        window.PRIMEIRO_NOME = iden.Nome_Programa ? iden.Nome_Programa.split(" ")[0] : "";
        window.NOME_MOEDA = iden.Nome_Moeda || "FidelityCoin(s)";
        window.NOME_MOEDA_SINGULAR = window.NOME_MOEDA.replace(/\(s\)$/i, '');
        window.PRIMEIRA_LETRA_CIFRAO = window.CIFRAO_MOEDA.charAt(0);
       // v.5.0_variável Global do Telefone Oficial 
       window.TELEFONE_OFICIAL = iden.Telefone_WPP || "";    
      

      //  VARIÁVEIS / BOT

   // Ajuste Telefone 
  function aplicarTelefoneDinamico() {
    // 1. Pega o valor bruto da variável global e limpa
    let telBruto = String(window.TELEFONE_OFICIAL || '');
    let numCru = telBruto.replace(/\D/g, '');
    let telFormatado = telBruto;

    // 2. Aplica a máscara inteligente (13 dígitos com DDI 55 ou 11 dígitos padrão)
    if (numCru.length === 13 && numCru.startsWith('55')) {
        telFormatado = `(${numCru.substring(2, 4)}) ${numCru.substring(4, 5)} ${numCru.substring(5, 9)}-${numCru.substring(9, 13)}`;
    } else if (numCru.length === 11) {
        telFormatado = `(${numCru.substring(0, 2)}) ${numCru.substring(2, 3)} ${numCru.substring(3, 7)}-${numCru.substring(7, 11)}`;
    }

    // 3. Varre a página inteira e preenche todas as tags com a classe .telefone-dinamico
    document.querySelectorAll('.telefone-dinamico').forEach(el => {
        el.innerText = telFormatado;
    });
}
